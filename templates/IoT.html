<!DOCTYPE html>
<html>
<head>
    <title>Home Automation Control</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script>
        function turnOnLED() {
            $.ajax({
                url: '/led/on',
                type: 'POST',
                success: function(response) {
                    console.log(response);
                },
                error: function(error) {
                    console.log(error);
                }
            });
        }

        function turnOffLED() {
            $.ajax({
                url: '/led/off',
                type: 'POST',
                success: function(response) {
                    console.log(response);
                },
                error: function(error) {
                    console.log(error);
                }
            });
        }
    </script>
</head>
<body>
    <h2>Home Automation Control</h2>
    
    <div>
        <h3>Light Control</h3>
        <button onclick="turnOnLED()">Turn On LED</button>
        <button onclick="turnOffLED()">Turn Off LED</button>
    </div>
    
    <div>

</body>
</html>
